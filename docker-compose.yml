services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stayfinder
      POSTGRES_PASSWORD: stayfinder
      POSTGRES_DB: stayfinder
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stayfinder"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
